# Default UZDoom config for the Nintendo Switch build.
# Copied next to the .nro; the engine rewrites it on exit with every setting.

[IWADSearch.Directories]
Path=.
Path=$DOOMWADDIR
Path=$PROGDIR/iwads
Path=$PROGDIR/pwads
Path=$PROGDIR

[FileSearch.Directories]
Path=$PROGDIR/pwads
Path=$PROGDIR/iwads
Path=$PROGDIR
Path=$DOOMWADDIR

[SoundfontSearch.Directories]
Path=$PROGDIR/soundfonts
Path=$PROGDIR/fm_banks

[Doom.AutoExec]
Path=./autoexec.cfg

[Heretic.AutoExec]
Path=./autoexec.cfg

[Hexen.AutoExec]
Path=./autoexec.cfg

[Strife.AutoExec]
Path=./autoexec.cfg

[Chex.AutoExec]
Path=./autoexec.cfg

[LastRun]
Version=234

[GlobalSettings]
use_joystick=true
vid_fullscreen=true
vid_defwidth=1280
vid_defheight=720
vid_vsync=true
vid_preferbackend=2
vid_scalemode=0
vid_scalefactor=1
snd_backend=openal
queryiwad=false

# Gamepad bindings: UZDoom 5 ships its own controller defaults
# (sticks move/look, ZR fire, ZL alt-fire, A use, B crouch, X reload, Y jump,
#  L/R switch weapons, + menu, - automap). Change them in Options > Controls.
